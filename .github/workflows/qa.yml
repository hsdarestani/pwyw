name: PWYW pilot browser E2E
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'static/**'
      - 'tests/**'
      - '.github/workflows/qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -q -r requirements.txt httpx==0.28.1
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate API and browser gameplay
        env:
          DATA_DIR: /tmp/pwyw-e2e-data
          COOKIE_SECURE: '0'
          PUBLIC_BASE_URL: http://127.0.0.1:8080
        run: |
          python -m unittest discover -s tests -p 'test_api.py' -v
          uvicorn app:app --port 8080 > /tmp/pwyw-e2e.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          node tests/ui.spec.js
